name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install isolated test database binary
        run: |
          curl --fail --silent --show-error --location https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2204-7.0.29.tgz -o "$RUNNER_TEMP/mongodb.tgz"
          echo "9bd7243d0042781a28ef7dd886d407832bc394d86945f8293a1822f25a35bd68  $RUNNER_TEMP/mongodb.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mongodb.tgz" -C "$RUNNER_TEMP"
          echo "MONGOD_BINARY=$RUNNER_TEMP/mongodb-linux-x86_64-ubuntu2204-7.0.29/bin/mongod" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:coverage
      - name: Install real scanner for offline antivirus integration tests
        run: sudo apt-get update && sudo apt-get install -y clamav
      - run: npm run test:scanner:dev
      - run: npm run test:e2e
      - run: npm run test:e2e:text-only
      - run: npm audit --omit=dev --audit-level=high
